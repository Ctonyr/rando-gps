<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Rando GPS</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
  >

  <style>

    html,
    body,
    #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #menu {

      position: absolute;

      top: 10px;
      left: 10px;

      z-index: 10;

      display: flex;
      gap: 8px;

    }

    button,
    label {

      background: white;

      border: none;

      border-radius: 8px;

      padding: 10px 14px;

      font-size: 15px;

      box-shadow:
        0 2px 6px rgba(0,0,0,0.25);

      cursor: pointer;

    }

    input[type="file"] {
      display: none;
    }

  </style>

</head>


<body>


  <div id="menu">

    <button id="gpsBtn">
      📍 Ma position
    </button>

    <label for="gpxFile">
      📂 Importer GPX
    </label>

    <input
      type="file"
      id="gpxFile"
      accept=".gpx"
    >

  </div>


  <div id="map"></div>


  <script type="module">

    import * as maplibregl from
      "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";


    // ==============================
    // CARTE SATELLITE
    // ==============================

    const map = new maplibregl.Map({

      container: "map",

      zoom: 6,

      center: [
        0.5,
        46.5
      ],

      style: {

        version: 8,

        sources: {

          satellite: {

            type: "raster",

            tiles: [

              "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"

            ],

            tileSize: 256

          }

        },

        layers: [

          {

            id: "satellite",

            type: "raster",

            source: "satellite"

          }

        ]

      }

    });


    // ==============================
    // CONTROLES
    // ==============================

    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );


    // ==============================
    // GPS
    // ==============================

    let gpsMarker = null;


    document
      .getElementById("gpsBtn")
      .addEventListener("click", () => {


        if (!navigator.geolocation) {

          alert(
            "La géolocalisation n'est pas disponible."
          );

          return;

        }


        navigator.geolocation.getCurrentPosition(

          (position) => {

            const longitude =
              position.coords.longitude;

            const latitude =
              position.coords.latitude;


            if (gpsMarker) {

              gpsMarker.remove();

            }


            gpsMarker =
              new maplibregl.Marker({
                color: "#e00000"
              })

              .setLngLat([
                longitude,
                latitude
              ])

              .addTo(map);


            map.flyTo({

              center: [
                longitude,
                latitude
              ],

              zoom: 15

            });

          },


          () => {

            alert(
              "Impossible d'obtenir la position GPS."
            );

          },


          {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0

          }

        );

      });


    // ==============================
// IMPORT GPX
// ==============================

document
  .getElementById("gpxFile")
  .addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    try {

      // Lecture du fichier
      const text = await file.text();

      // Analyse du XML
      const parser = new DOMParser();

      const xml = parser.parseFromString(
        text,
        "application/xml"
      );

      // Vérification
      if (xml.querySelector("parsererror")) {
        throw new Error("GPX invalide");
      }


      // ==========================================
      // RÉCUPÉRATION DE LA TRACE
      // ==========================================

      const trackPoints =
        Array.from(xml.getElementsByTagName("trkpt"));

      const coordinates = trackPoints
        .map(point => {

          const lat =
            parseFloat(point.getAttribute("lat"));

          const lon =
            parseFloat(point.getAttribute("lon"));

          return [lon, lat];

        })
        .filter(point =>
          Number.isFinite(point[0]) &&
          Number.isFinite(point[1])
        );


      if (coordinates.length < 2) {

        throw new Error(
          "Aucune trace GPS trouvée dans ce GPX."
        );

      }


      // ==========================================
      // SUPPRESSION DE L'ANCIENNE TRACE
      // ==========================================

      if (map.getLayer("gpx-line")) {
        map.removeLayer("gpx-line");
      }

      if (map.getSource("gpx")) {
        map.removeSource("gpx");
      }


      // ==========================================
      // AJOUT DE LA TRACE
      // ==========================================

      map.addSource("gpx", {

        type: "geojson",

        data: {

          type: "Feature",

          properties: {},

          geometry: {

            type: "LineString",

            coordinates: coordinates

          }

        }

      });


      map.addLayer({

        id: "gpx-line",

        type: "line",

        source: "gpx",

        paint: {

          "line-color": "#ff0000",

          "line-width": 5,

          "line-opacity": 0.9

        }

      });


      // ==========================================
      // ZOOM AUTOMATIQUE SUR LA TRACE
      // ==========================================

      const bounds =
        new maplibregl.LngLatBounds();

      coordinates.forEach(point => {

        bounds.extend(point);

      });


      map.fitBounds(bounds, {

        padding: 60,

        duration: 1000

      });


      // ==========================================
      // WAYPOINTS
      // ==========================================

      const waypoints =
        Array.from(xml.getElementsByTagName("wpt"));


      waypoints.forEach(wpt => {

        const lat =
          parseFloat(wpt.getAttribute("lat"));

        const lon =
          parseFloat(wpt.getAttribute("lon"));


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lon)
        ) {
          return;
        }


        // Nom du waypoint
        const nameElement =
          wpt.getElementsByTagName("name")[0];

        const name =
          nameElement
            ? nameElement.textContent
            : "Waypoint";


        // Marqueur bleu
        new maplibregl.Marker({
          color: "#0066ff"
        })

          .setLngLat([
            lon,
            lat
          ])

          .setPopup(

            new maplibregl.Popup({
              offset: 25
            })

              .setText(name)

          )

          .addTo(map);

      });


      // ==========================================
      // MESSAGE
      // ==========================================

      console.log(
        "GPX chargé :",
        coordinates.length,
        "points"
      );

      console.log(
        "Waypoints :",
        waypoints.length
      );


      alert(
        "GPX chargé !\n\n" +
        coordinates.length +
        " points de trace\n" +
        waypoints.length +
        " waypoint(s)"
      );


    } catch (error) {

      console.error(error);

      alert(
        "❌ Impossible de lire ce fichier GPX.\n\n" +
        error.message
      );

    }

  });
