<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test carte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script type="module">

    import * as maplibregl from
      "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";

    const map = new maplibregl.Map({

      container: "map",

      style:
        "https://demotiles.maplibre.org/style.json",

      center: [0, 46],

      zoom: 5

    });

  </script>

</body>
</html>
