<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rando GPS</title>

    <!-- MapLibre -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Barre supérieure */

        #topbar {

            position: absolute;

            top: 10px;
            left: 10px;
            right: 10px;

            height: 50px;

            background: rgba(0,0,0,0.75);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            z-index: 10;

            font-family: Arial, sans-serif;

            font-size: 20px;

            font-weight: bold;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.4);
        }

        /* Bouton GPS */

        #gpsButton {

            position: absolute;

            right: 15px;
            bottom: 25px;

            width: 55px;
            height: 55px;

            border: none;

            border-radius: 50%;

            background: white;

            font-size: 25px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.4);

            z-index: 10;
        }

    </style>

</head>


<body>

    <div id="map"></div>

    <div id="topbar">
        🗺️ Rando GPS
    </div>

    <button id="gpsButton">
        📍
    </button>


    <!-- MapLibre -->

    <script type="module">

        import * as maplibregl
            from "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";


        /*
         * Création de la carte
         */

        const map = new maplibregl.Map({

            container: "map",

            center: [2.5, 46.8],

            zoom: 5,

            style: {

                version: 8,

                sources: {

                    satellite: {

                        type: "raster",

                        tiles: [

                            "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"

                        ],

                        tileSize: 256

                    }

                },

                layers: [

                    {

                        id: "satellite",

                        type: "raster",

                        source: "satellite"

                    }

                ]

            }

        });


        /*
         * Contrôles de navigation
         */

        map.addControl(

            new maplibregl.NavigationControl(),

            "top-right"

        );


        /*
         * Bouton GPS
         */

        const gpsButton =
            document.getElementById("gpsButton");


        gpsButton.addEventListener(
            "click",
            () => {

                if (!navigator.geolocation) {

                    alert(
                        "La géolocalisation n'est pas disponible."
                    );

                    return;

                }


                navigator.geolocation.getCurrentPosition(

                    (position) => {

                        const longitude =
                            position.coords.longitude;

                        const latitude =
                            position.coords.latitude;


                        /*
                         * Position actuelle
                         */

                        new maplibregl.Marker({
                            color: "#e53935"
                        })

                        .setLngLat([
                            longitude,
                            latitude
                        ])

                        .addTo(map);


                        /*
                         * Centrer la carte
                         */

                        map.flyTo({

                            center: [
                                longitude,
                                latitude
                            ],

                            zoom: 15

                        });

                    },


                    () => {

                        alert(
                            "Impossible d'obtenir votre position GPS."
                        );

                    },

                    {

                        enableHighAccuracy: true,

                        timeout: 10000,

                        maximumAge: 5000

                    }

                );

            }

        );

    </script>

</body>

</html>
