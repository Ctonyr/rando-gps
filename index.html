<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rando GPS</title>

  <link
    href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #menu {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    button, label {
      background: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    input {
      display: none;
    }
  </style>
</head>

<body>

  <div id="menu">

    <button id="gpsBtn">
      📍 Ma position
    </button>

    <label for="gpxFile">
      📂 Importer GPX
    </label>

    <input
      type="file"
      id="gpxFile"
      accept=".gpx"
    >

  </div>

  <div id="map"></div>

  <script type="module">

    import maplibregl from
      "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";


    const map = new maplibregl.Map({

      container: "map",

      style: {

        version: 8,

        sources: {

          satellite: {

            type: "raster",

            tiles: [
              "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"
            ],

            tileSize: 256
          }

        },

        layers: [

          {
            id: "satellite",

            type: "raster",

            source: "satellite"
          }

        ]

      },

      center: [2.5, 46.8],

      zoom: 5

    });


    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );


    document
      .getElementById("gpsBtn")
      .addEventListener("click", () => {

        navigator.geolocation.getCurrentPosition(

          position => {

            const lon =
              position.coords.longitude;

            const lat =
              position.coords.latitude;


            new maplibregl.Marker({
              color: "#ff0000"
            })

              .setLngLat([lon, lat])

              .addTo(map);


            map.flyTo({

              center: [lon, lat],

              zoom: 15

            });

          },

          error => {

            alert(
              "Impossible d'obtenir la position GPS."
            );

          },

          {

            enableHighAccuracy: true

          }

        );

      });


    // Le bouton GPX est présent,
    // mais l'import sera ajouté ensuite.

  </script>

</body>
</html>
