
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rando GPS</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
html,body,#map {margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
#menu {position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:7px}
button,label {background:white;border:0;border-radius:8px;padding:10px;font-size:14px;box-shadow:0 2px 6px #0004;cursor:pointer}
input[type=file]{display:none}
#status {position:absolute;z-index:5;bottom:12px;left:10px;right:10px;padding:10px;background:#ffffffed;border-radius:8px;font-size:13px}
#login {position:absolute;z-index:10;top:65px;left:10px;right:10px;max-width:360px;background:white;padding:14px;border-radius:10px;box-shadow:0 2px 8px #0005;display:none}
#login input {box-sizing:border-box;width:100%;padding:10px;margin:5px 0 10px;border:1px solid #aaa;border-radius:6px;font-size:15px}
#login small {color:#555}
</style>
</head>
<body>
<div id="menu">
<button id="gpsBtn">📍 Ma position</button>
<button id="traccarBtn">🚙 Connecter Traccar</button>
<button id="poiBtn">📌 Ajouter POI</button>
<label for="gpxFile">📂 Importer GPX</label>
<input type="file" id="gpxFile" accept=".gpx,application/gpx+xml">
</div>

<div id="login">
<strong>Connexion Traccar</strong>
<p><small>Identifiants de ton compte Traccar. Ils ne seront pas enregistrés dans le fichier.</small></p>
<label for="email">Adresse e-mail</label>
<input id="email" type="email" autocomplete="username" placeholder="Ton e-mail">
<label for="password">Mot de passe</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe">
<button id="connectBtn">Se connecter</button>
<button id="cancelBtn">Annuler</button>
</div>

<div id="map"></div>
<div id="status">Chargement de la carte...</div>

<script type="module">
import * as maplibregl from "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";

const status = document.getElementById("status");
const setStatus = text => status.textContent = text;

const map = new maplibregl.Map({
 container:"map",
 style:{
  version:8,
  sources:{
   satellite:{
    type:"raster",
    tiles:["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"],
    tileSize:256
   }
  },
  layers:[{id:"satellite",type:"raster",source:"satellite"}]
 },
 center:[0.5,46.5],
 zoom:6
});
map.addControl(new maplibregl.NavigationControl(),"bottom-right");
map.on("load",()=>setStatus("🛰️ Carte satellite prête"));

let gpsMarker=null;
let trackLayerAdded=false;
let traccarAuth=null;
let traccarDevices=[];
let traccarMarkers={};
let refreshTimer=null;
let addingPoi=false;
let poiMarkers=[];

document.getElementById("gpsBtn").onclick=()=>{
 if(!navigator.geolocation){alert("GPS non disponible");return;}
 setStatus("📍 Recherche de ta position...");
 navigator.geolocation.getCurrentPosition(pos=>{
  const c=[pos.coords.longitude,pos.coords.latitude];
  if(gpsMarker)gpsMarker.remove();
  gpsMarker=new maplibregl.Marker({color:"#e00000"}).setLngLat(c).setPopup(new maplibregl.Popup().setText("Ma position")).addTo(map);
  map.flyTo({center:c,zoom:15});
  setStatus("📍 Position GPS trouvée");
 },()=>setStatus("❌ Position GPS indisponible"),{enableHighAccuracy:true,timeout:15000});
};

document.getElementById("traccarBtn").onclick=()=>{
 document.getElementById("login").style.display="block";
};
document.getElementById("cancelBtn").onclick=()=>{
 document.getElementById("login").style.display="none";
};
const WORKER_URL = "https://capredgps.anthonycrivron.workers.dev";

async function api(path){
 const response = await fetch(WORKER_URL + path);

 if(!response.ok){
  throw new Error("Worker Traccar : erreur HTTP "+response.status);
 }

 return await response.json();
}
async function connectTraccar(){

 setStatus("🔄 Connexion à Traccar...");

 try{

  traccarDevices=await api("/devices");

  if(!Array.isArray(traccarDevices)){
   throw new Error("Réponse Traccar inattendue");
  }

  await updatePositions();

  if(refreshTimer){
   clearInterval(refreshTimer);
  }

  refreshTimer=setInterval(updatePositions,15000);

  setStatus(
   "✅ Traccar connecté : "+
   traccarDevices.length+
   " appareil(s). Actualisation toutes les 15 secondes."
  );

 }catch(error){

  console.error(error);

  setStatus(
   "❌ Impossible de récupérer les appareils Traccar."
  );

  alert(
   "Connexion impossible à Traccar.\n\n"+
   error.message
  );
 }
}

document.getElementById("traccarBtn").onclick=connectTraccar;

async function updatePositions(){
 if(!traccarAuth)return;
 try{
  const positions=await api("/positions");
  for(const device of traccarDevices){
   const p=positions.find(pos=>pos.deviceId===device.id);
   if(!p)continue;
   const coords=[p.longitude,p.latitude];
   if(!Number.isFinite(coords[0])||!Number.isFinite(coords[1]))continue;
   const label=device.name||("Appareil "+device.id);
   const popup=label+" · "+new Date(p.fixTime||p.deviceTime).toLocaleString("fr-FR");
   if(traccarMarkers[device.id]){
    traccarMarkers[device.id].setLngLat(coords);
    traccarMarkers[device.id].getPopup().setText(popup);
   }else{
    traccarMarkers[device.id]=new maplibregl.Marker({color:"#16803c"})
     .setLngLat(coords)
     .setPopup(new maplibregl.Popup({offset:25}).setText(popup))
     .addTo(map);
   }
  }
  setStatus("🚙 Traccar : "+Object.keys(traccarMarkers).length+" appareil(s) positionné(s). Dernière vérification : "+new Date().toLocaleTimeString("fr-FR"));
 }catch(error){
  console.error(error);
  setStatus("⚠️ Problème de lecture Traccar. Nouvelle tentative automatique.");
 }
}

// Import GPX : trace et waypoints
document.getElementById("gpxFile").addEventListener("change",async event=>{
 const file=event.target.files[0];
 if(!file)return;
 try{
  const xml=new DOMParser().parseFromString(await file.text(),"application/xml");
  if(xml.querySelector("parsererror"))throw new Error("Fichier GPX invalide");
  const points=[...xml.getElementsByTagName("trkpt"),...xml.getElementsByTagName("rtept")]
   .map(p=>[Number(p.getAttribute("lon")),Number(p.getAttribute("lat"))])
   .filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
  if(points.length<2)throw new Error("Aucune trace GPS trouvée");
  if(map.getLayer("gpx-line"))map.removeLayer("gpx-line");
  if(map.getSource("gpx"))map.removeSource("gpx");
  map.addSource("gpx",{type:"geojson",data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:points}}});
  map.addLayer({id:"gpx-line",type:"line",source:"gpx",paint:{"line-color":"#ff2600","line-width":5}});
  const bounds=new maplibregl.LngLatBounds();
  points.forEach(p=>bounds.extend(p));
  map.fitBounds(bounds,{padding:60,duration:1000});
  const wpts=[...xml.getElementsByTagName("wpt")];
  wpts.forEach(w=>{
   const lat=Number(w.getAttribute("lat")),lon=Number(w.getAttribute("lon"));
   if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
   const name=w.getElementsByTagName("name")[0]?.textContent||"Waypoint";
   new maplibregl.Marker({color:"#1769ff"}).setLngLat([lon,lat])
    .setPopup(new maplibregl.Popup().setText(name)).addTo(map);
  });
  setStatus("✅ GPX chargé : "+points.length+" points et "+wpts.length+" waypoint(s)");
 }catch(error){
  console.error(error);alert("Import GPX impossible : "+error.message);
 }
 event.target.value="";
});

// Ajout POI en touchant la carte
document.getElementById("poiBtn").onclick=()=>{
 addingPoi=true;
 setStatus("📌 Appuie sur la carte pour placer un POI.");
};
map.on("click",event=>{
 if(!addingPoi)return;
 addingPoi=false;
 const name=prompt("Nom du POI :");
 if(!name||!name.trim()){setStatus("Ajout du POI annulé");return;}
 const marker=new maplibregl.Marker({color:"#f59e0b"})
  .setLngLat([event.lngLat.lng,event.lngLat.lat])
  .setPopup(new maplibregl.Popup().setText(name.trim()))
  .addTo(map);
 poiMarkers.push(marker);
 setStatus("📌 POI ajouté : "+name.trim());
});
</script>
</body>
</html>
